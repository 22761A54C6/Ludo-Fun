
databases:
  - name: ludo-db
    databaseName: ludo
    user: ludo
    plan: free

services:
  - type: web
    name: online-ludo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-db
          property: connectionString
      # Gemini key for voice dice rolls: set its value in the Render dashboard (never commit it)
      - key: GEMINI_API_KEY
        sync: false
