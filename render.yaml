databases:
  - name: ludo-db
    databaseName: ludo
    user: ludo
    plan: free

services:
  - type: web
    name: online-ludo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ludo-db
          property: connectionString
